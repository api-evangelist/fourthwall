name: Fourthwall
kind: company
description: Fourthwall is a creator commerce platform for building a branded online
  shop and storefront, selling physical merch, digital products, memberships, and
  accepting donations and gifts. It exposes a public Storefront API (storefront token)
  for headless product/collection/cart experiences and a Platform / Open API (Basic
  Auth API key or OAuth) for managing orders, products, promotions, gifting, memberships,
  and webhooks.
