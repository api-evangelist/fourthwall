description: >-
  FinOps view of Fourthwall spend. Unlike usage-metered API platforms,
  Fourthwall does not bill for API calls - the Storefront API and Platform
  (Open) API are free with a shop. Cost is driven by commerce: the flat base
  cost of physical products fulfilled from Fourthwall's catalog (deducted from
  the selling price at order time, with the creator keeping 100% of the set
  margin), percentage fees on digital products and memberships, standard
  payment-processing fees, and an optional flat Fourthwall Pro subscription.
  Net creator revenue is the difference between the selling price and these
  costs.
notes: >-
  Fee percentages, base costs, and the Pro price change over time; verify
  against the Fourthwall pricing/FAQ pages during reconciliation.
