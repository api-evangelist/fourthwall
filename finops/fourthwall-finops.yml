meters:
- name: catalog_product_base_cost
  description: Flat base cost of physical products fulfilled from Fourthwall's catalog, charged per item at order time.
  unit: items
  aggregation: sum
  dimensions:
  - shop
  - product
- name: digital_product_fee
  description: Percentage fee on digital product sales (Free plan; waived/reduced on Pro).
  unit: sales
  aggregation: sum
  dimensions:
  - shop
  - product
- name: membership_fee
  description: Percentage fee on membership subscription revenue.
  unit: sales
  aggregation: sum
  dimensions:
  - shop
  - tier
- name: payment_processing_fee
  description: Standard payment-processor fee (percentage plus per-transaction flat fee).
  unit: transactions
  aggregation: sum
  dimensions:
  - shop
- name: pro_subscription
  description: Optional flat monthly/annual Fourthwall Pro subscription.
  unit: subscription
  aggregation: sum
  dimensions:
  - shop
- name: api_usage
  description: Storefront API and Platform (Open) API usage - included at no charge; tracked only against rate limits.
  unit: requests
  aggregation: sum
  dimensions:
  - shop
  - api
principles:
- name: Visibility
  description: Pull orders, donations, and payout transactions via the Platform API to reconcile base costs, fees, and net revenue per product and per shop.
- name: Allocation
  description: Tag revenue and costs by product, collection, and membership tier to see margin contribution by line.
- name: Optimization
  description: Set selling-price margins deliberately above base cost; evaluate self-sourced products (no product fee) and the Pro plan where its fee waivers exceed its subscription cost.
- name: Accountability
  description: Review payout transactions and per-product margins on a regular cadence against revenue targets.
